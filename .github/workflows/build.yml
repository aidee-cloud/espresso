name: Build Espresso

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: VERSION="${{ steps.v.outputs.version }}" ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Espresso
          path: build/*.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Espresso ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: build/*.zip
          body: |
            Download **Espresso-${{ steps.v.outputs.version }}.zip** below, unzip it and drag Espresso into Applications.
            First launch: macOS will block it once. Open System Settings → Privacy & Security, click **Open Anyway**, and confirm.
            See the README for details.
